<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="560" fill="#fff"/>
<text x="600" y="48" font-size="32" font-weight="bold" text-anchor="middle" fill="#222">Ventilador de 4 pines (PWM): la placa decide la velocidad</text>
<text x="60" y="110" font-size="20" fill="#333">La placa enciende y apaga la señal miles de veces por segundo: cuanto más rato encendida, más gira.</text>
<g font-size="24" font-weight="bold" fill="#222"><text x="60" y="185">Poco</text><text x="60" y="285">Medio</text><text x="60" y="385">Todo</text></g>
<g>
<rect x="190" y="155" width="560" height="44" rx="6" fill="#eceff1"/><rect x="190" y="155" width="140" height="44" rx="6" fill="#1e6fd0"/>
<rect x="190" y="255" width="560" height="44" rx="6" fill="#eceff1"/><rect x="190" y="255" width="280" height="44" rx="6" fill="#1e6fd0"/>
<rect x="190" y="355" width="560" height="44" rx="6" fill="#1e6fd0"/>
</g>
<g font-size="21" fill="#333"><text x="770" y="186">25 % → gira despacio, silencio</text><text x="770" y="286">50 % → velocidad media</text><text x="770" y="386">100 % → a tope, más ruido</text></g>
<rect x="60" y="440" width="300" height="80" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
<g><circle cx="105" cy="480" r="18" fill="#111"/><circle cx="175" cy="480" r="18" fill="#f5c400"/><circle cx="245" cy="480" r="18" fill="#2e7d32"/><circle cx="315" cy="480" r="18" fill="#1e6fd0"/></g>
<g font-size="20" fill="#222"><text x="400" y="460">Negro: tierra · Amarillo: 12 V · Verde: avisa de las RPM</text><text x="400" y="495" font-weight="bold" fill="#1e6fd0">Azul: el cable extra que controla la velocidad</text><text x="400" y="528" fill="#555">Los de 3 pines no tienen este cable y se regulan peor.</text></g>
</svg>
