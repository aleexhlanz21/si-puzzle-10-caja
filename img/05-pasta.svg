<g font-size="28" font-weight="bold" text-anchor="middle"><text x="220" y="370" fill="#c62828">✘ Muy poca</text><text x="600" y="370" fill="#2e7d32">✔ Un guisante</text><text x="980" y="370" fill="#c62828">✘ Demasiada</text></g>
<g font-size="20" text-anchor="middle" fill="#333"><text x="220" y="410">Quedan zonas sin cubrir</text><text x="600" y="410">Al apretar se reparte sola</text><text x="980" y="410">Se desborda y ensucia</text>
