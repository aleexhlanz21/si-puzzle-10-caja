<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="r" markerWidth="26" markerHeight="26" refX="20" refY="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#d84315"/></marker>
<marker id="b" markerWidth="26" markerHeight="26" refX="20" refY="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1e6fd0"/></marker>
</defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="600" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#222">Refrigeración por aire vs. líquida (AIO)</text>
<line x1="600" y1="80" x2="600" y2="570" stroke="#ccc" stroke-width="3"/>
<!-- AIRE -->
<text x="300" y="110" font-size="28" font-weight="bold" text-anchor="middle" fill="#d08a45">POR AIRE</text>
<g fill="#b8c4cf" stroke="#7a8794"><rect x="150" y="150" width="200" height="16"/><rect x="150" y="180" width="200" height="16"/><rect x="150" y="210" width="200" height="16"/><rect x="150" y="240" width="200" height="16"/><rect x="150" y="270" width="200" height="16"/><rect x="150" y="300" width="200" height="16"/></g>
<g stroke="#c77a33" stroke-width="10"><line x1="200" y1="140" x2="200" y2="340"/><line x1="300" y1="140" x2="300" y2="340"/></g>
<rect x="160" y="330" width="180" height="30" fill="#d08a45"/>
<rect x="190" y="362" width="120" height="28" fill="#3d4f63"/><text x="250" y="383" font-size="18" fill="#fff" text-anchor="middle">CPU</text>
<rect x="360" y="150" width="40" height="170" rx="6" fill="#37474f"/>
<g stroke="#d84315" stroke-width="5" marker-end="url(#r)"><line x1="140" y1="230" x2="80" y2="230"/></g>
<g stroke="#1e6fd0" stroke-width="5" marker-end="url(#b)"><line x1="470" y1="230" x2="410" y2="230"/></g>
<g font-size="20" fill="#333">
<text x="60" y="430">✔ Barata y muy fiable</text>
<text x="60" y="462">✔ Casi nada se puede romper</text>
<text x="60" y="494">✘ Ocupa mucho sobre la placa</text>
<text x="60" y="526">✘ Puede chocar con la RAM o la tapa</text>
</g>
<!-- LIQUIDA -->
<text x="900" y="110" font-size="28" font-weight="bold" text-anchor="middle" fill="#1e6fd0">LÍQUIDA (AIO)</text>
<rect x="680" y="290" width="130" height="70" rx="10" fill="#455a64"/><text x="745" y="332" font-size="18" fill="#fff" text-anchor="middle">Bomba</text>
<rect x="695" y="362" width="100" height="28" fill="#3d4f63"/><text x="745" y="383" font-size="18" fill="#fff" text-anchor="middle">CPU</text>
<rect x="1000" y="140" width="70" height="250" rx="8" fill="#cfd6dd" stroke="#6b7785" stroke-width="2"/>
<text x="1035" y="415" font-size="18" text-anchor="middle">Radiador</text>
<rect x="1080" y="140" width="30" height="250" rx="5" fill="#37474f"/>
<path d="M720 290 C720 180, 850 160, 1000 170" stroke="#d84315" stroke-width="10" fill="none"/>
<path d="M1000 360 C900 370, 840 330, 812 320" stroke="#1e6fd0" stroke-width="10" fill="none"/>
<text x="760" y="230" font-size="18" fill="#d84315">agua caliente</text>
<text x="830" y="375" font-size="18" fill="#1e6fd0">agua fría</text>
<g font-size="20" fill="#333">
<text x="640" y="462">✔ Deja libre la zona de la CPU</text>
<text x="640" y="494">✔ Muy buena con CPUs potentes</text>
<text x="640" y="526">✘ Más cara; la bomba puede fallar</text>
<text x="640" y="430">✔ Cerrada, sin mantenimiento</text>
</g>
</svg>
