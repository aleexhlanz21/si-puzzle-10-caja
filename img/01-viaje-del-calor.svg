<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="a" markerWidth="26" markerHeight="26" refX="20" refY="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#d84315"/></marker></defs>
<rect width="1200" height="520" fill="#fff"/>
<text x="600" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#222">El viaje del calor: del procesador a la calle</text>
<g font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">
<rect x="30" y="120" width="190" height="150" rx="18" fill="#3d4f63"/><text x="125" y="190">CPU</text><text x="125" y="222" font-size="18" font-weight="normal">se calienta</text>
<rect x="270" y="120" width="190" height="150" rx="18" fill="#9e9e9e"/><text x="365" y="190">Pasta</text><text x="365" y="222" font-size="18" font-weight="normal">térmica</text>
<rect x="510" y="120" width="190" height="150" rx="18" fill="#d08a45"/><text x="605" y="190">Disipador</text><text x="605" y="222" font-size="18" font-weight="normal">metal con aletas</text>
<rect x="750" y="120" width="190" height="150" rx="18" fill="#1e6fd0"/><text x="845" y="190">Ventilador</text><text x="845" y="222" font-size="18" font-weight="normal">sopla el aire</text>
<rect x="990" y="120" width="180" height="150" rx="18" fill="#2e7d32"/><text x="1080" y="190">Caja</text><text x="1080" y="222" font-size="18" font-weight="normal">lo saca fuera</text>
</g>
<g stroke="#d84315" stroke-width="6" marker-end="url(#a)"><line x1="222" y1="195" x2="262" y2="195"/><line x1="462" y1="195" x2="502" y2="195"/><line x1="702" y1="195" x2="742" y2="195"/><line x1="942" y1="195" x2="982" y2="195"/></g>
<g font-size="19" fill="#333" text-anchor="middle">
<text x="125" y="320">Genera el calor</text><text x="125" y="346">al trabajar</text>
<text x="365" y="320">Rellena los huecos</text><text x="365" y="346">entre CPU y disipador</text>
<text x="605" y="320">Recoge el calor y</text><text x="605" y="346">lo reparte en aletas</text>
<text x="845" y="320">Se lleva el calor</text><text x="845" y="346">de las aletas</text>
<text x="1080" y="320">Expulsa el aire</text><text x="1080" y="346">caliente al exterior</text>
</g>
<rect x="150" y="400" width="900" height="80" rx="14" fill="#fff3e0" stroke="#d08a45" stroke-width="2"/>
<text x="600" y="450" font-size="22" text-anchor="middle" fill="#222">Si un solo paso falla, el calor se queda atascado y la CPU se calienta</text>
</svg>
